name: Android / Kotlin Bootstrap

on:
  push:
    branches: [ main, "codex/**" ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test Android test-compilation gate
        run: python3 -m unittest discover -s tools -p 'test_check_android_test_compilation.py' -v

      - name: Run repository pre-push gate
        run: sh scripts/pre_push_check.sh

      - name: Verify both NTRIP distribution variants
        run: sh gradlew :app:testGooglePlayDebugUnitTest :app:testSideloadDebugUnitTest :app:compileGooglePlayDebugKotlin :app:compileSideloadDebugKotlin --no-parallel

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: |
            **/build/test-results/**/*.xml
            **/build/reports/tests/**
          if-no-files-found: warn

      - name: Provision pinned RTKLIB-EX source
        shell: bash
        run: |
          RTKLIB_REF="$(python3 -c 'import json; print(json.load(open("third_party/rtklib-ex/snapshot.json", encoding="utf-8"))["resolvedCommit"])')"
          python3 tools/update_rtklib_ex.py \
            --ref "$RTKLIB_REF" \
            --metadata "$RUNNER_TEMP/rtklib-ex-snapshot.json"

      - name: Assemble debug bootstrap
        run: sh gradlew assembleDebug --no-parallel

      - name: Exercise APK signing with disposable CI identity
        shell: bash
        run: |
          sdkmanager "build-tools;36.0.0" >/dev/null
          SIGNING_TEST_DIR="$(mktemp -d)"
          trap 'rm -rf "$SIGNING_TEST_DIR"' EXIT
          export SIDELOAD_STORE_PASSWORD="$(openssl rand -hex 32)"
          export SIDELOAD_KEY_PASSWORD="$SIDELOAD_STORE_PASSWORD"
          export SIDELOAD_KEY_ALIAS="ci-test-only"
          keytool -genkeypair -keystore "$SIGNING_TEST_DIR/test.p12" \
            -storetype PKCS12 -alias "$SIDELOAD_KEY_ALIAS" -keyalg RSA \
            -keysize 2048 -validity 1 -dname "CN=Disposable CI signing test" \
            -storepass:env SIDELOAD_STORE_PASSWORD -keypass:env SIDELOAD_KEY_PASSWORD
          keytool -exportcert -keystore "$SIGNING_TEST_DIR/test.p12" \
            -alias "$SIDELOAD_KEY_ALIAS" -storepass:env SIDELOAD_STORE_PASSWORD \
            -file "$SIGNING_TEST_DIR/certificate.der"
          export SIDELOAD_KEYSTORE_BASE64="$(base64 -w 0 "$SIGNING_TEST_DIR/test.p12")"
          export SIDELOAD_CERT_SHA256="$(sha256sum "$SIGNING_TEST_DIR/certificate.der" | cut -d ' ' -f 1)"
          for ATTEMPT in 1 2; do
            python3 tools/sign_sideload_apk.py \
              app/build/outputs/apk/sideload/debug/app-sideload-debug.apk \
              "$SIGNING_TEST_DIR/signed-$ATTEMPT.apk" \
              --apksigner "$ANDROID_HOME/build-tools/36.0.0/apksigner"
          done
