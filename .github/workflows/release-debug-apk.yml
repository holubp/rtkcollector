name: Release Debug APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing prerelease tag to build and receive the APK
        required: true
        default: v1.0-RC3
        type: string

permissions:
  contents: write

jobs:
  build-and-attach:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag }}

    steps:
      - name: Validate requested tag
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+-RC[0-9]+$ ]]; then
            echo "Release tag must use the form v<major>.<minor>-RC<number>." >&2
            exit 1
          fi

      - name: Check out exact release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Verify exact tag checkout
        shell: bash
        run: |
          test "$(git describe --exact-match --tags HEAD)" = "$RELEASE_TAG"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Provision pinned RTKLIB-EX source
        shell: bash
        run: |
          RTKLIB_REF="$(python3 -c 'import json; print(json.load(open("third_party/rtklib-ex/snapshot.json", encoding="utf-8"))["resolvedCommit"])')"
          python3 tools/update_rtklib_ex.py \
            --ref "$RTKLIB_REF" \
            --metadata "$RUNNER_TEMP/rtklib-ex-snapshot.json"

      - name: Build sideload debug APK
        run: sh gradlew :app:assembleSideloadDebug --no-parallel

      - name: Stage APK and checksum
        shell: bash
        run: |
          mkdir -p release-assets
          ASSET="rtkcollector-${RELEASE_TAG}-sideload-debug.apk"
          cp app/build/outputs/apk/sideload/debug/app-sideload-debug.apk "release-assets/$ASSET"
          sha256sum "release-assets/$ASSET" | tee "release-assets/$ASSET.sha256"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rtkcollector-${{ inputs.tag }}-sideload-debug
          path: release-assets/
          if-no-files-found: error

      - name: Attach APK to prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq '.isPrerelease' | grep -qx true
          gh release upload "$RELEASE_TAG" release-assets/* --repo "$GITHUB_REPOSITORY" --clobber
