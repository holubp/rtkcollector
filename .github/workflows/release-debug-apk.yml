name: Release Debug APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing prerelease tag to build and receive the APK
        required: true
        default: v1.0-RC5
        type: string

permissions:
  contents: write

concurrency:
  group: sideload-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build-and-attach:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag }}

    steps:
      - name: Validate requested tag
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+-RC[0-9]+$ ]]; then
            echo "Release tag must use the form v<major>.<minor>-RC<number>." >&2
            exit 1
          fi

      - name: Check out exact release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact tag checkout
        shell: bash
        run: |
          test "$(git describe --exact-match --tags HEAD)" = "$RELEASE_TAG"

      - name: Check out reviewed signing tooling
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .release-tooling
          sparse-checkout: |
            tools/sign_sideload_apk.py
            tools/test_sign_sideload_apk.py
            .github/workflows/release-debug-apk.yml
            .github/workflows/android.yml
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Test signing tooling
        run: python3 -m unittest discover -s .release-tooling/tools -p test_sign_sideload_apk.py -v

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Provision pinned RTKLIB-EX source
        shell: bash
        run: |
          RTKLIB_REF="$(python3 -c 'import json; print(json.load(open("third_party/rtklib-ex/snapshot.json", encoding="utf-8"))["resolvedCommit"])')"
          python3 tools/update_rtklib_ex.py \
            --ref "$RTKLIB_REF" \
            --metadata "$RUNNER_TEMP/rtklib-ex-snapshot.json"

      - name: Build sideload debug APK
        run: sh gradlew :app:assembleSideloadDebug --no-parallel

      - name: Sign APK with stable sideload identity
        env:
          SIDELOAD_KEYSTORE_BASE64: ${{ secrets.SIDELOAD_KEYSTORE_BASE64 }}
          SIDELOAD_STORE_PASSWORD: ${{ secrets.SIDELOAD_STORE_PASSWORD }}
          SIDELOAD_KEY_PASSWORD: ${{ secrets.SIDELOAD_KEY_PASSWORD }}
          SIDELOAD_KEY_ALIAS: ${{ secrets.SIDELOAD_KEY_ALIAS }}
          SIDELOAD_CERT_SHA256: ${{ vars.SIDELOAD_CERT_SHA256 }}
        shell: bash
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;36.0.0" >/dev/null
          mkdir -p release-assets
          ASSET="rtkcollector-${RELEASE_TAG}-sideload-debug.apk"
          python3 .release-tooling/tools/sign_sideload_apk.py \
            app/build/outputs/apk/sideload/debug/app-sideload-debug.apk \
            "release-assets/$ASSET" \
            --apksigner "$ANDROID_HOME/build-tools/36.0.0/apksigner" \
            | tee "release-assets/$ASSET.signing.txt"
          printf 'Source commit: %s\nSigning tooling commit: %s\n' \
            "$(git rev-parse HEAD)" "$(git -C .release-tooling rev-parse HEAD)" \
            >> "release-assets/$ASSET.signing.txt"

      - name: Stage checksum
        shell: bash
        run: |
          ASSET="rtkcollector-${RELEASE_TAG}-sideload-debug.apk"
          (
            cd release-assets
            sha256sum "$ASSET" | tee "$ASSET.sha256"
          )

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rtkcollector-${{ inputs.tag }}-sideload-debug
          path: release-assets/
          if-no-files-found: error

      - name: Attach APK to prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq '.isPrerelease' | grep -qx true
          gh release upload "$RELEASE_TAG" release-assets/* --repo "$GITHUB_REPOSITORY" --clobber
